[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hecras"
version = "0.1.0"
description = "From-scratch 1D/2D hydraulic river-analysis engine (HEC-RAS-style) in Rust with Python bindings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Joel Fiddes" },
]
keywords = ["hydraulics", "river", "hydrology", "open-channel", "geoscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hecras._hecras"
python-source = "python"
